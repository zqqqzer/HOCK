<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOCK — Cart</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#fff;
    color:#111;
}

/* HEADER */

header{
    height:72px;
    padding:0 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #e5e5e5;
    position:sticky;
    top:0;
    background:#fff;
    z-index:100;
}

.logo{
    text-decoration:none;
    color:#000;
    font-size:27px;
    font-weight:900;
    letter-spacing:5px;
}

.logo span{
    font-size:21px;
}

.shop-link{
    text-decoration:none;
    color:#111;
    font-size:11px;
    font-weight:bold;
    letter-spacing:2px;
}

/* MAIN */

.cart-page{
    max-width:1100px;
    margin:auto;
    padding:70px 6%;
}

.title{
    text-align:center;
    margin-bottom:50px;
}

.title span{
    color:#888;
    font-size:10px;
    letter-spacing:4px;
}

.title h1{
    margin-top:12px;
    font-size:40px;
    letter-spacing:5px;
}

/* LAYOUT */

.cart-layout{
    display:grid;
    grid-template-columns:1fr 350px;
    gap:50px;
}

/* ITEMS */

.cart-items{
    border-top:1px solid #ddd;
}

.cart-item{
    display:grid;
    grid-template-columns:130px 1fr auto;
    gap:25px;
    align-items:center;
    padding:25px 0;
    border-bottom:1px solid #ddd;
}

.item-image{
    width:130px;
    height:150px;
    background:#eee;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:900;
    letter-spacing:3px;
}

.item-info h3{
    font-size:16px;
}

.item-info p{
    color:#777;
    font-size:12px;
    margin-top:8px;
}

.item-price{
    margin-top:15px;
    font-weight:bold;
    font-size:14px;
}

.item-controls{
    margin-top:20px;
    display:flex;
    align-items:center;
    gap:12px;
}

.qty{
    display:flex;
    height:38px;
    border:1px solid #ccc;
}

.qty button{
    width:35px;
    border:0;
    background:#fff;
    cursor:pointer;
    font-size:17px;
}

.qty button:hover{
    background:#eee;
}

.qty span{
    width:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:bold;
}

.remove{
    border:0;
    background:none;
    color:#888;
    cursor:pointer;
    font-size:10px;
    letter-spacing:1px;
}

.remove:hover{
    color:#000;
}

.item-total{
    font-weight:bold;
    font-size:15px;
}

/* SUMMARY */

.summary{
    border:1px solid #ddd;
    padding:30px;
    height:max-content;
    position:sticky;
    top:100px;
}

.summary h2{
    font-size:18px;
    letter-spacing:2px;
    margin-bottom:25px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    padding:13px 0;
    font-size:13px;
    border-bottom:1px solid #eee;
}

.summary-row.total{
    border:0;
    padding-top:22px;
    font-size:17px;
    font-weight:bold;
}

.checkout{
    display:block;
    text-align:center;
    text-decoration:none;
    background:#000;
    color:#fff;
    padding:17px;
    margin-top:20px;
    font-size:11px;
    font-weight:bold;
    letter-spacing:2px;
}

.checkout:hover{
    background:#333;
}

.continue{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#555;
    text-decoration:none;
    font-size:10px;
    letter-spacing:1px;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:80px 20px;
    border:1px solid #eee;
}

.empty-icon{
    font-size:45px;
}

.empty h2{
    margin-top:20px;
    font-size:22px;
}

.empty p{
    color:#777;
    font-size:13px;
    margin-top:10px;
}

.empty a{
    display:inline-block;
    margin-top:25px;
    background:#000;
    color:#fff;
    padding:14px 28px;
    text-decoration:none;
    font-size:11px;
    font-weight:bold;
    letter-spacing:2px;
}

/* FOOTER */

footer{
    margin-top:70px;
    padding:40px 20px;
    background:#050505;
    color:#fff;
    text-align:center;
}

footer h3{
    letter-spacing:6px;
}

footer p{
    color:#777;
    font-size:10px;
    margin-top:10px;
    letter-spacing:2px;
}

/* MOBILE */

@media(max-width:800px){

    .cart-page{
        padding:45px 20px;
    }

    .cart-layout{
        grid-template-columns:1fr;
        gap:35px;
    }

    .summary{
        position:static;
    }

    .cart-item{
        grid-template-columns:90px 1fr;
        gap:15px;
    }

    .item-image{
        width:90px;
        height:120px;
    }

    .item-total{
        grid-column:2;
    }

}

</style>
</head>

<body>

<header>

<a href="index.html" class="logo">
HOCK <span>🦅</span>
</a>

<a href="index.html" class="shop-link">
← CONTINUE SHOPPING
</a>

</header>


<main class="cart-page">

<div class="title">

<span>YOUR HOCK</span>

<h1>SHOPPING CART</h1>

</div>


<div id="cartContent"></div>

</main>


<footer>

<h3>HOCK 🦅</h3>

<p>WEAR YOUR IDENTITY</p>

</footer>


<script>

const cartContent =
document.getElementById("cartContent");


function getCart(){

    return JSON.parse(
        localStorage.getItem("hockCart")
    ) || [];

}


function saveCart(cart){

    localStorage.setItem(
        "hockCart",
        JSON.stringify(cart)
    );

}


function renderCart(){

    const cart = getCart();


    /* EMPTY CART */

    if(cart.length === 0){

        cartContent.innerHTML = `

        <div class="empty">

            <div class="empty-icon">🛒</div>

            <h2>Your cart is empty</h2>

            <p>
                You haven't added anything yet.
            </p>

            <a href="index.html">
                START SHOPPING
            </a>

        </div>

        `;

        return;

    }


    let subtotal = 0;

    let itemsHTML = "";


    cart.forEach((item,index)=>{

        const quantity =
            Number(item.quantity) || 1;

        const price =
            Number(item.price) || 0;

        const itemTotal =
            price * quantity;

        subtotal += itemTotal;


        itemsHTML += `

        <div class="cart-item">

            <div class="item-image">
                HOCK
            </div>


            <div class="item-info">

                <h3>
                    ${item.name}
                </h3>

                <p>
                    SIZE: ${item.size}
                </p>

                <div class="item-price">
                    ${price} EGP
                </div>


                <div class="item-controls">

                    <div class="qty">

                        <button
                            onclick="changeQuantity(${index}, -1)">
                            −
                        </button>

                        <span>
                            ${quantity}
                        </span>

                        <button
                            onclick="changeQuantity(${index}, 1)">
                            +
                        </button>

                    </div>


                    <button
                        class="remove"
                        onclick="removeItem(${index})">

                        REMOVE

                    </button>

                </div>

            </div>


            <div class="item-total">

                ${itemTotal} EGP

            </div>

        </div>

        `;

    });


    cartContent.innerHTML = `

    <div class="cart-layout">

        <div class="cart-items">

            ${itemsHTML}

        </div>


        <aside class="summary">

            <h2>ORDER SUMMARY</h2>

            <div class="summary-row">

                <span>Subtotal</span>

                <span>${subtotal} EGP</span>

            </div>


            <div class="summary-row">

                <span>Shipping</span>

                <span>Calculated at checkout</span>

            </div>


            <div class="summary-row total">

                <span>TOTAL</span>

                <span>${subtotal} EGP</span>

            </div>


            <a
                href="checkout.html"
                class="checkout">

                CHECKOUT →

            </a>


            <a
                href="index.html"
                class="continue">

                CONTINUE SHOPPING

            </a>

        </aside>

    </div>

    `;

}


/* CHANGE QUANTITY */

function changeQuantity(index, amount){

    const cart = getCart();

    cart[index].quantity =
        Number(cart[index].quantity) + amount;


    if(cart[index].quantity < 1){

        cart[index].quantity = 1;

    }


    saveCart(cart);

    renderCart();

}


/* REMOVE */

function removeItem(index){

    const cart = getCart();

    cart.splice(index,1);

    saveCart(cart);

    renderCart();

}


renderCart();

</script>

</body>
</html>
